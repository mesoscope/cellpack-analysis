[project]
name = "cellpack-analysis"
description = "Analysis methods for cellPACK"
authors = [
    {name = "Saurabh Mogre", email = "saurabh.mogre@alleninstitute.org"},
]
license = {text = "Allen Institute Software License"}
version = "1.0.2"
readme = "README.md"
requires-python = "~=3.11.0"
dependencies = [
    "bioio>=3.0.0",
    "bioio-ome-tiff>=1.1.0",
    "boto3",
    "cellpack",
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "quilt3",
    "rtree",
    "scikit-image",
    "scipy",
    "seaborn",
    "statannotations>=0.7.2",
    "statsmodels>=0.14.5",
    "tqdm",
    "trimesh",
    "vtk",
]

[dependency-groups]
lint = [
    "black",
    "isort",
    "ruff",
    "mypy",
]
test = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["lint", "test"]
cache-dir = ".cache/uv"
package = true

[tool.uv.build-backend]
module-root = ""
source-include = [
    "cellpack_analysis",
    "docs",
    "tests",
    ".gitignore",
    ".python-version",
    "LICENSE",
    "logging.conf",
    "Makefile",
    "pyproject.toml",
    "README.md",
    "uv.lock"
]
source-exclude = [
    ".env",
    ".git",
    ".github",
    ".ipynb_checkpoints",
    ".mypy_cache",
    "__pycache__",
    ".cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "data",
    "results",
]

[tool.uv.sources]
cellpack = { git = "https://github.com/mesoscope/cellpack", rev = "5c31f56d89697f977f54ee001209eff92047b35c" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
(
    archive/
    | data/
    | results/
    | docs/
)
'''

[tool.isort]
line_length = 100
profile = "black"
skip_glob = [
    "**/archive/**",
    "**/data/**",
    "**/results/**",
    "**/docs/**",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "**/archive/**",
    "**/data/**",
    "**/results/**",
    "**/docs/**",
]

[tool.ruff.lint]
extend-select = [
    "E",      # style errors
    "F",      # flakes
    "D",      # pydocstyle
    "I001",   # isort
    "UP",     # pyupgrade
    "N",      # pep8-naming
    # "S",    # bandit
    "C",      # flake8-comprehensions
    "B",      # flake8-bugbear
    "A001",   # flake8-builtins
    "RUF",    # ruff-specific rules
    "RUF100", # Unused noqa directive
]
extend-ignore = [
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D103", # Missing docstring in public function
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
    "D202", # Blank lines between the function body and the function docstring
    "D203", # 1 blank line required before class docstring
    "D205", # 1 blank line required between summary line and description
    "D212", # Multi-line docstring summary should start at the first line
    "D213", # Multi-line docstring summary should start at the second line
    "D413", # Missing blank line after last section
    "D416", # Section name should end with a colon
]

[tool.ruff.lint.mccabe]
max-complexity = 20 # Adjust maximum McCabe complexity (C901)

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D"]
# Notebooks contain long-form markdown prose and heading-style docstrings in
# `# %%` cells, where line-length and docstring-punctuation rules don't apply.
"**/notebooks/*.py" = ["D", "E501"]

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
show_error_codes = true
exclude = [
    ".*/archive/.*",
    ".*/data/.*",
    ".*/results/.*",
    ".*/docs/.*",
    ".*/notebooks/.*",
]
